name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build wheel and run pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust 1.85 toolchain
        uses: dtolnay/rust-toolchain@1.85
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Python build and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "maturin>=1.7,<2.0" pytest numpy mypy

      - name: Check lockfile is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Formatting (cargo fmt)
        run: cargo fmt --all --check

      - name: Static analysis (cargo clippy)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Rust unit tests
        run: cargo test --locked

      - name: Build release wheel with maturin
        run: maturin build --release --locked --out dist

      - name: Install wheel and run pytest
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install numpy pytest mypy dist/sciencekit-*.whl
          /tmp/wheel-venv/bin/pytest -q tests
